<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f1ec;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box;color:#1A1E29}
    .card{background:#01C38E;padding:32px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);width:100%;max-width:420px;box-sizing:border-box}
    h1{margin-top:0;font-size:1.4rem}
    dl{background:#ffffff;border-radius:8px;padding:12px 16px;margin:0}
    dt{font-size:.8rem;color:#132D46;font-weight:600;margin-top:8px}
    dd{margin:2px 0 0}
    button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:#132D46;color:#ffffff;font-size:1rem;cursor:pointer}
    .boton{display:block;margin-top:20px;padding:11px;border-radius:8px;background:#ffffff;color:#132D46;text-align:center;font-weight:600;text-decoration:none}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#132D46;--paper:#FFFFFF;--orange:#01C38E;--line-light:rgba(255,255,255,.28);}
    body{box-sizing:border-box;padding-top:120px;}
    .chrome{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--ink);color:var(--paper);padding:14px 24px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-family:'Work Sans',sans-serif;}
    .chrome-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
    .chrome-brand{font-family:'Fraunces',serif;font-weight:800;font-size:20px;letter-spacing:.02em;}
    .chrome-brand span{color:var(--orange);}
    .chrome-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;font-family:'Space Mono',monospace;}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;}
    .tab{background:transparent;border:1px solid var(--line-light);color:var(--paper);opacity:.7;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;transition:.15s;text-decoration:none;}
    .tab:hover{opacity:1;border-color:var(--paper);}
    .tab.active{background:var(--orange);border-color:var(--orange);opacity:1;color:var(--ink);font-weight:600;}
    .dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--orange);}
    .tab.active .dot{background:var(--ink);}
    @media(max-width:640px){body{padding-top:170px;}}
  </style>
</head>
<body>
<div class="chrome">
  <div class="chrome-top">
    <div class="chrome-brand">Andén<span>.</span></div>
    <div class="chrome-label">Prototipo · mockup visual estático</div>
  </div>
  <div class="tabs">
    <a class="tab" href="/"><span class="dot"></span>Inicio</a>
    <a class="tab" href="/vehiculos"><span class="dot"></span>Buscar</a>
    <a class="tab" href="/#dashboard"><span class="dot"></span>Panel de control</a>
  </div>
</div>
  <div class="card">
    <h1>Hola, <span th:text="${usuario?.nombre}">turista</span></h1>
    <p>Este es tu perfil de turista en Andén.</p>

    <dl th:if="${usuario}">
      <dt>Nombre</dt><dd th:text="${usuario.nombre}">Nombre</dd>
      <dt>Correo</dt><dd th:text="${usuario.correo}">correo</dd>
      <dt>Teléfono / WhatsApp</dt><dd th:text="${usuario.telefono} ?: 'Sin registrar'">teléfono</dd>
    </dl>

    <!-- Sprint 2: ir a buscar vehículos con filtros -->
    <a class="boton" th:href="@{/vehiculos}">Buscar vehículos</a>

    <form th:action="@{/logout}" method="post">
      <button type="submit">Cerrar sesión</button>
    </form>
  </div>
</body>
</html>
