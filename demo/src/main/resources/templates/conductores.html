<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conductores disponibles</title>
    <style>
        body{font-family:system-ui,sans-serif;background:#f4f1ec;margin:0;padding:32px 16px;box-sizing:border-box;color:#1A1E29}
        main{max-width:960px;margin:0 auto}
        h1{margin-top:0;font-size:1.4rem;color:#132D46}
        .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
        .card{background:#01C38E;padding:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);box-sizing:border-box}
        .card h2{margin:0 0 14px;font-size:1.15rem;color:#132D46}
        dl{background:#ffffff;border-radius:8px;padding:12px 16px;margin:0}
        dt{font-size:.8rem;color:#132D46;font-weight:600;margin-top:8px}
        dt:first-child{margin-top:0}
        dd{margin:2px 0 0}
        .msg{padding:10px;border-radius:8px;font-size:.9rem;background:#ffffff;color:#132D46}
    </style>
</head>
<body>
<main>
    <h1>Conductores disponibles</h1>

    <section th:fragment="lista">
        <p class="msg" th:if="${#lists.isEmpty(conductores)}">No hay conductores disponibles por ahora.</p>

        <div class="lista">
            <article class="card" th:each="c : ${conductores}">
                <h2 th:text="${c.nombre}">Nombre</h2>
                <dl>
                    <dt>Marca</dt><dd th:text="${c.marcaVehiculo} ?: 'Sin dato'">Marca</dd>
                    <dt>Modelo</dt><dd th:text="${c.modeloVehiculo} ?: 'Sin dato'">Modelo</dd>
                    <dt>Placa</dt><dd th:text="${c.placaVehiculo}">Placa</dd>
                    <dt>Pasajeros</dt><dd th:text="${c.asientosVehiculo} + ' puestos'">Pasajeros</dd>
                    <dt>SOAT vigente hasta</dt><dd th:text="${c.fechaVencimientoSoat}">Fecha</dd>
                    <dt>Tecnomecánica hasta</dt><dd th:text="${c.fechaVencimientoTecnomecanica}">Fecha</dd>
                </dl>
            </article>
        </div>
    </section>
</main>
</body>
</html>
