<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f1ec;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
    .card{background:#01C38E;padding:32px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);width:100%;max-width:360px}
    h1{margin-top:0;font-size:1.4rem}
    label{display:block;margin:14px 0 4px;font-size:.9rem}
    input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
    button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:8px;background:#132D46;color:#ffffff;font-size:1rem;cursor:pointer}
    .msg{padding:10px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
    .error{background:#fde8e8;color:#9b1c1c}
    .ok{background:#e6f4ea;color:#1e6b34}
    p.link{text-align:center;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>Iniciar sesión</h1>

    <div class="msg error" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="msg ok" th:if="${param.logout}">Cerraste sesión correctamente.</div>
    <div class="msg ok" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</div>

    <form th:action="@{/login}" method="post">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" required>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Entrar</button>
    </form>

    <p class="link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
  </div>
</body>
</html>
