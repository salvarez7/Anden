<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar vehículos</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f4f1ec;margin:0;padding:32px 16px;box-sizing:border-box;color:#1A1E29}
    main{max-width:960px;margin:0 auto}
    h1{margin-top:0;font-size:1.4rem;color:#132D46}
    .filtros{background:#132D46;color:#ffffff;border-radius:12px;padding:20px;display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
    @media(min-width:600px){.filtros{grid-template-columns:1fr 1fr auto;align-items:end}}
    label{display:block;margin-bottom:4px;font-size:.9rem}
    input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font:inherit;background:#ffffff}
    button{padding:11px 20px;border:0;border-radius:8px;background:#01C38E;color:#132D46;font-size:1rem;font-weight:700;cursor:pointer}
    .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
    .card{background:#01C38E;padding:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
    .card h2{margin:0 0 4px;font-size:1.15rem;color:#132D46}
    .etiqueta{display:inline-block;margin-bottom:12px;padding:2px 10px;border-radius:999px;background:#132D46;color:#ffffff;font-size:.8rem}
    dl{background:#ffffff;border-radius:8px;padding:12px 16px;margin:0}
    dt{font-size:.8rem;color:#132D46;font-weight:600;margin-top:8px}
    dt:first-child{margin-top:0}
    dd{margin:2px 0 0}
    .msg{padding:14px;border-radius:8px;background:#ffffff;color:#132D46}
    a{color:#132D46}
  </style>
</head>
<body>
<main>
  <h1>Busca el vehículo para tu estadía</h1>

  <!-- method="get": los filtros viajan en la URL (/vehiculos?gama=premium&asientos=5) -->
  <form class="filtros" th:action="@{/vehiculos}" method="get">
    <div>
      <label for="gama">Gama</label>
      <select id="gama" name="gama">
        <option value="">Todas las gamas</option>
        <!-- th:each recorre Gama.values(); th:selected deja marcada la que el usuario eligió -->
        <option th:each="g : ${gamas}" th:value="${g.codigo}" th:text="${g.etiqueta}"
                th:selected="${g.codigo == gamaElegida}">Gama</option>
      </select>
    </div>
    <div>
      <label for="asientos">¿Cuántos pasajeros son?</label>
      <input type="number" id="asientos" name="asientos" min="1" max="20" placeholder="Ej. 5"
             th:value="${asientosElegidos}">
    </div>
    <button type="submit">Buscar</button>
  </form>

  <!-- RF-13: mensaje cuando no hay resultados -->
  <p class="msg" th:if="${#lists.isEmpty(resultados)}">
    No encontramos vehículos disponibles con esos filtros. Prueba con otra gama o con menos pasajeros.
  </p>

  <div class="lista">
    <article class="card" th:each="r : ${resultados}">
      <h2 th:text="${r.vehiculo.modelo}">Renault Duster</h2>
      <span class="etiqueta" th:text="${r.etiquetaGama()}">Gama</span>
      <dl>
        <dt>Pasajeros</dt><dd th:text="${r.vehiculo.numeroAsientos} + ' puestos'">4 puestos</dd>
        <dt>Conductor</dt><dd th:text="${r.conductor.nombre}">Nombre</dd>
        <dt>Placa</dt><dd th:text="${r.conductor.placaVehiculo}">ABC123</dd>
      </dl>
    </article>
  </div>

  <p><a th:href="@{/turista}">Volver a mi perfil</a></p>
</main>
</body>
</html>
